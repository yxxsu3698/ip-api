<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP信息查询</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .box {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .info {
      font-size: 16px;
      line-height: 2;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>你的IP信息</h1>
    <div class="info" id="result">
      加载中...
    </div>
  </div>

  <script>
    // 获取IP信息
    fetch('https://api.ipapi.is')
      .then(res => res.json())
      .then(data => {
        document.getElementById('result').innerHTML = `
          IP地址：${data.ip} <br>
          国家：${data.location.country} <br>
          省份：${data.location.state} <br>
          城市：${data.location.city} <br>
          运营商：${data.asn.org}
        `;
      })
      .catch(err => {
        document.getElementById('result').innerText = '获取失败';
      });
  </script>
</body>
</html>
